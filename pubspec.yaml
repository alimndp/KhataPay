name: khatapay
description: "KhataPay - Business Management App (Employee, Salary, Accounts)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase integration
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.4.0

  # UI & Design
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

  # Utilities
  url_launcher: ^6.2.0
  pdf: ^3.10.0
  printing: ^5.11.0
  csv: ^5.1.1
  path_provider: ^2.1.0
  share_plus: ^7.2.0
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/