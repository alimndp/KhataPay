name: Flutter Android Build & Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 📁 Added working-directory pointing to your nested folder
      - name: Install Project Dependencies
        working-directory: ./KhataPay 
        run: |
          flutter clean
          flutter pub get

      # 📁 Added working-directory and run clean before building
      - name: Build Release APK
        working-directory: ./KhataPay
        run: flutter build apk --release

       Caviar Tagging Step
      - name: Generate Unique Version Tag
        id: tag
        run: echo "VERSION_TAG=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Flutter Release ${{ env.VERSION_TAG }}
          draft: false
          prerelease: false
          # Updated file path to match your nested structure
          files: KhataPay/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
