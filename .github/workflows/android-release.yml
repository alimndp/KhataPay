name: Flutter Android Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Generate Unique Version Tag
        id: tag
        run: echo "VERSION_TAG=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: KhataPay Release ${{ env.VERSION_TAG }}
          body: |
            ## KhataPay - Business Management App
            
            ### Features
            - 👥 Employee Management
            - 📅 Attendance Tracking
            - 💰 Salary Disbursement with UPI Payment
            - 📊 Account Module (Income/Expense/Reports)
            - 🔐 Role-Based Access
            
            ### Download
            - APK: `app-release.apk`
            
            ### Installation
            1. Download the APK
            2. Enable "Install from unknown sources" on your device
            3. Install and open KhataPay
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khatapay-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30